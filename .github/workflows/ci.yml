name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  CI: true

jobs:
  specs:
    name: Solidus ${{ matrix.solidus_version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The versions the stores run: rowan and sirdar are on solidus_core
        # 3.0.8, watg on 3.2.5. Both sit on Rails 6.1.
        solidus_version: ["3.0.8", "3.2.5"]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB: postgres
      RAILS_ENV: test
      SOLIDUS_VERSION: ${{ matrix.solidus_version }}
      RAILS_VERSION: "~> 6.1.0"
      # Both sets are needed because the two Solidus versions generate
      # config/database.yml differently. 3.2.5's generator reads DB_HOST and
      # friends; 3.0.8's writes a hardcoded `username: postgres` and emits no
      # host at all, so those connection details only reach it through libpq's
      # own PG* variables.
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.6"
          bundler-cache: true

      - name: Install the PostgreSQL client
        run: sudo apt-get -yqq install libpq-dev

      # spec/dummy is gitignored and spec_helper requires it, so the app has to
      # be generated before rspec runs. `rake` on its own is not an option: the
      # Rakefile declares `task default: [:spec]` without ever instantiating
      # RSpec::Core::RakeTask.
      - name: Generate the dummy app
        run: bundle exec rake test_app

      - name: Run the specs
        run: bundle exec rspec --format progress

      - name: Store Capybara screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capybara-screenshots-solidus-${{ matrix.solidus_version }}
          path: spec/dummy/tmp/capybara
          if-no-files-found: ignore
